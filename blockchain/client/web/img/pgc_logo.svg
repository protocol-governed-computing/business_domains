<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="t d">
  <title id="t">Protocol-Governed Computing</title>
  <desc id="d">Software governance encloses the transformation compilers, the protocol compiler and the protocol runtime, each bound to the snapshot at the centre.</desc>

  <!-- Colour rides on presentation attributes so every renderer honours it. The stylesheet only
       adjusts the line work for a dark background, where the cascade beats the attribute; the
       discs are solid blocks that hold on either page, so they are left alone. -->
  <style>
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #8FA8CE; fill: none; }
      .arc  { fill: #8FA8CE; }
      /* A solid black hub needs an edge once the page behind it is dark. */
      .hub  { stroke: #8FA8CE; stroke-width: 4; }
    }
  </style>

  <!-- The governance boundary, closed, with its name set inside it.
       The name is outlined rather than set as live text: textPath is unsupported by several
       common rasterizers, and a logo that depends on an installed font is not a logo. -->
  <circle class="ring" cx="320" cy="320" r="295" fill="none" stroke="#14305C" stroke-width="12"/>
