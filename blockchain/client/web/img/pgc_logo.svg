  <!-- Bindings, drawn only in the gap between hub and stage, so the mark needs no keyline. -->
  <g class="ring" fill="none" stroke="#14305C" stroke-width="14">
    <path d="M250.7 280 L217 260.5 M389.3 280 L423 260.5 M320 400 L320 437"/>
  </g>

  <g text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
     font-weight="700" font-size="12.5" letter-spacing="0.4">

    <!-- The three stages a change passes through, each labelled in its own inverse. -->
    <circle cx="151.1" cy="222.5" r="78" fill="#C8102E"/>
    <g fill="#FFFFFF">
      <text x="151.1" y="201">TRANSFORMATION</text>
      <text x="151.1" y="217">DESIGN &amp;</text>
      <text x="151.1" y="233">CONSTRUCTION</text>
      <text x="151.1" y="249">COMPILERS</text>
    </g>

    <!-- The white stage carries a keyline, or it disappears on a light page. -->
    <circle cx="488.9" cy="222.5" r="78" fill="#FFFFFF" stroke="#14305C" stroke-width="5"/>
    <g fill="#000000">
      <text x="488.9" y="218">PROTOCOL</text>
      <text x="488.9" y="234">COMPILER</text>
    </g>

    <circle cx="320" cy="515" r="78" fill="#1F6FD0"/>
    <g fill="#FFFFFF">
      <text x="320" y="511">PROTOCOL</text>
      <text x="320" y="527">RUNTIME</text>
    </g>

    <!-- The snapshot: sealed at build time, and the only interface between the three. -->
    <circle class="hub" cx="320" cy="320" r="80" fill="#000000"/>
    <g fill="#FFFFFF">
      <text x="320" y="316" font-size="19" letter-spacing="1">SNAPSHOT</text>
      <text x="320" y="337" font-size="14" font-weight="400" letter-spacing="0.4"
            fill-opacity="0.88">the interface</text>
    </g>
  </g>
</svg>
