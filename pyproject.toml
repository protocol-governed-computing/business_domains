[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pgc-domains"
version = "2.0.1"
description = "PGC business domains — the capability implementations the composed reference snapshot binds at execution"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Bhash Ganti", email = "bachipeachy@gmail.com" }]

keywords = ["protocol-governed-computing", "pgc", "business-domain", "capability-transforms"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

# `runtime.ct_executor` carries the capability-transform contract; the wallet address
# transform hashes with keccak from pycryptodome.
dependencies = [
  "pgc-runtime>=2.0.0",
]

# Domain cryptography is optional by design and is not required by the core compile path. Exactly
# one capability transform needs it — `CT_PURE_DERIVE_WALLET_ADDRESS_V0` imports Keccak-256 from
# pycryptodome, which `hashlib.sha3_256` cannot substitute for. Install the extra to admit the
# blockchain domain's transforms:  pip install "pgc-domains[blockchain]"
[project.optional-dependencies]
blockchain = ["pycryptodome"]

[project.urls]
Homepage = "https://omnibachi.org/"
Repository = "https://github.com/protocol-governed-computing/business_domains"
Standard = "https://doi.org/10.5281/zenodo.22150616"

# Only the implementation subtrees ship. A sealed snapshot binds these by fully
# qualified module path — `blockchain.implementation.capability_transforms.atoms.
# ct_pure_derive_wallet_address_v0` — so the top-level names are fixed by snapshots
# already sealed and cannot be nested under a prefix.
#
# testbed/, client/, registry/, cr_dossiers/ and snapshot/ are excluded: harnesses,
# browser surfaces and declarations, none of which a runtime imports. The registry
# in particular stays repository-side, resolved through PGC_PLATFORM_ROOT and
# PGC_DOMAIN_ROOTS, so a wheel never carries a competing governance surface.
#
# Resolution order is unambiguous: run.sh puts PGC_IMPL_ROOTS on PYTHONPATH, which
# precedes site-packages, so a workspace resolves from source and a pip-only install
# resolves from here. They do not compete.
[tool.setuptools.packages.find]
where = ["."]
include = [
  "ai_governance.implementation*",
  "blockchain.implementation*",
  "book_library_mgmt.implementation*",
]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.json"]
